<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول تناوبی عناصر - با ایزوتوپ‌ها و فراوانی</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }

body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}

header { text-align: center; margin-bottom: 30px; }

h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}

.subtitle { color: #9aa0b5; font-size: 0.95rem; margin-bottom: 20px; }

.search-box { max-width: 500px; margin: 0 auto; }

.search-box input {
    width: 100%;
    padding: 12px 20px;
    border-radius: 30px;
    border: 2px solid rgba(0, 212, 255, 0.3);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s;
}

.search-box input:focus {
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

.periodic-table {
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    gap: 4px;
    max-width: 1400px;
    margin: 0 auto;
    direction: ltr;
}

.element-card {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    min-width: 0;
}

.element-card:hover {
    transform: scale(1.12);
    z-index: 10;
    box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
    border-color: #00d4ff;
}

.element-card .atomic-number { font-size: 0.65rem; color: #9aa0b5; position: absolute; top: 4px; left: 6px; }
.element-card .symbol { font-size: 1.3rem; font-weight: 700; line-height: 1; }
.element-card .name { font-size: 0.55rem; color: #c0c5d4; text-align: center; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

.element-card[data-category="nonmetal"] { background: rgba(0, 212, 255, 0.2); }
.element-card[data-category="noble-gas"] { background: rgba(155, 89, 182, 0.25); }
.element-card[data-category="alkali-metal"] { background: rgba(231, 76, 60, 0.25); }
.element-card[data-category="alkaline-earth-metal"] { background: rgba(230, 126, 34, 0.25); }
.element-card[data-category="metalloid"] { background: rgba(241, 196, 15, 0.2); }
.element-card[data-category="halogen"] { background: rgba(46, 204, 113, 0.2); }
.element-card[data-category="transition-metal"] { background: rgba(52, 152, 219, 0.2); }
.element-card[data-category="post-transition-metal"] { background: rgba(26, 188, 156, 0.2); }
.element-card[data-category="lanthanide"] { background: rgba(255, 107, 129, 0.2); }
.element-card[data-category="actinide"] { background: rgba(255, 159, 67, 0.2); }
.element-card[data-category="unknown"] { background: rgba(149, 165, 166, 0.2); }

.empty-slot { aspect-ratio: 1; }

.modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000; backdrop-filter: blur(5px);
}

.modal.hidden { display: none; }

.modal-content {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 20px;
    padding: 30px;
    max-width: 700px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    border: 1px solid rgba(0, 212, 255, 0.3);
    box-shadow: 0 0 60px rgba(0, 212, 255, 0.2);
}

.close-btn {
    position: absolute; top: 15px; left: 20px;
    font-size: 2rem; cursor: pointer; color: #9aa0b5;
    transition: color 0.3s;
}

.close-btn:hover { color: #00d4ff; }

.modal-header { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; direction: ltr; }

.modal-symbol-box {
    width: 90px; height: 90px; border-radius: 15px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-weight: 700;
}

.modal-symbol-box .big-symbol { font-size: 2.5rem; line-height: 1; }
.modal-symbol-box .big-number { font-size: 0.9rem; color: #9aa0b5; }

.modal-title { flex: 1; direction: rtl; text-align: right; }
.modal-title h2 { font-size: 1.8rem; margin-bottom: 5px; }
.modal-title .atomic-mass { color: #00d4ff; font-size: 1rem; }

.info-section { margin-bottom: 20px; }
.info-section h3 {
    color: #00d4ff; margin-bottom: 12px; font-size: 1.1rem;
    border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    padding-bottom: 6px;
}

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.info-item {
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 14px; border-radius: 10px;
    display: flex; justify-content: space-between;
    direction: rtl;
}

.info-item .label { color: #9aa0b5; font-size: 0.9rem; }
.info-item .value { font-weight: 600; color: #fff; font-size: 0.9rem; direction: ltr; }

.isotope-table { width: 100%; border-collapse: collapse; direction: ltr; font-size: 0.9rem; }
.isotope-table th { background: rgba(0, 212, 255, 0.15); padding: 10px; text-align: center; color: #00d4ff; font-weight: 600; }
.isotope-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.isotope-table tr:hover { background: rgba(255, 255, 255, 0.05); }

.abundance-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.abundance-bar-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #7b2ff7); border-radius: 3px; }

@media (max-width: 900px) {
    .periodic-table { gap: 2px; }
    .element-card .symbol { font-size: 1rem; }
    .element-card .name { font-size: 0.45rem; }
    .modal-content { padding: 20px; }
    .info-grid { grid-template-columns: 1fr; }
    h1 { font-size: 1.5rem; }
}
</style>

const tableContainer = document.getElementById('periodicTable');

function renderPeriodicTable() {
    tableContainer.innerHTML = '';
    const gridMap = {};

    elementsData.forEach(el => {
        let col, row;

        if (el.number === 1) { col = 1; row = 1; }
        else if (el.number === 2) { col = 18; row = 1; }
        else if (el.number >= 3 && el.number <= 4) { col = el.number - 2; row = 2; }
        else if (el.number >= 5 && el.number <= 10) { col = el.number + 8; row = 2; }
        else if (el.number >= 11 && el.number <= 12) { col = el.number - 10; row = 3; }
        else if (el.number >= 13 && el.number <= 18) { col = el.number; row = 3; }
        else if (el.number >= 19 && el.number <= 36) { col = el.number - 18; row = 4; }
        else if (el.number >= 37 && el.number <= 54) { col = el.number - 36; row = 5; }
        else if (el.number >= 55 && el.number <= 56) { col = el.number - 54; row = 6; }
        else if (el.number >= 57 && el.number <= 71) { col = el.number - 57 + 3; row = 9; }
        else if (el.number >= 72 && el.number <= 86) { col = el.number - 68; row = 6; }
        else if (el.number >= 87 && el.number <= 88) { col = el.number - 86; row = 7; }
        else if (el.number >= 89 && el.number <= 103) { col = el.number - 89 + 3; row = 10; }
        else if (el.number >= 104 && el.number <= 118) { col = el.number - 100; row = 7; }

        if (col && row) gridMap[`${row}-${col}`] = el;
    });

    for (let r = 1; r <= 10; r++) {
        for (let c = 1; c <= 18; c++) {
            if ((r === 9 || r === 10) && c < 3) {
                const empty = document.createElement('div');
                empty.className = 'empty-slot';
                tableContainer.appendChild(empty);
                continue;
            }

            const key = `${r}-${c}`;
            const el = gridMap[key];

            if (el) {
                const card = createElementCard(el);
                card.style.gridRow = r;
                card.style.gridColumn = c;
                tableContainer.appendChild(card);
            } else {
                const empty = document.createElement('div');
                empty.className = 'empty-slot';
                empty.style.gridRow = r;
                empty.style.gridColumn = c;
                tableContainer.appendChild(empty);
            }
        }
    }
}

function createElementCard(el) {
    const card = document.createElement('div');
    card.className = 'element-card';
    card.setAttribute('data-category', el.category);
    card.innerHTML = `
        <span class="atomic-number">${el.number}</span>
        <span class="symbol">${el.symbol}</span>
        <span class="name">${el.nameFa || el.name}</span>
    `;
    card.onclick = () => showElementDetail(el);
    return card;
}

function showElementDetail(el) {
    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modalBody');

    let isotopeRows = '';
    if (el.isotopes && el.isotopes.length > 0) {
        el.isotopes.forEach(iso => {
            const ab = iso.abundance || 0;
            const barWidth = Math.min(ab, 100);
            isotopeRows += `
                <tr>
                    <td><sup>${iso.massNumber}</sup>${el.symbol}</td>
                    <td>${iso.massNumber}</td>
                    <td>${ab > 0 ? ab.toFixed(4) + '%' : 'ردیابی'}</td>
                    <td>
                        <div class="abundance-bar">
                            <div class="abundance-bar-fill" style="width: ${barWidth}%"></div>
                        </div>
                    </td>
                </tr>
            `;
        });
    } else {
        isotopeRows = '<tr><td colspan="4" style="text-align:center;color:#9aa0b5;">ایزوتوپ پایدار شناخته شده‌ای ندارد</td></tr>';
    }

    let abundanceHtml = '';
    const ab = el.abundance || {};
    if (Object.keys(ab).length > 0) {
        abundanceHtml = '<div class="info-grid">';
        if (ab.crust !== undefined) abundanceHtml += `<div class="info-item"><span class="label">پوسته زمین (ppm)</span><span class="value">${ab.crust}</span></div>`;
        if (ab.sea !== undefined) abundanceHtml += `<div class="info-item"><span class="label">آب دریا (ppm)</span><span class="value">${ab.sea}</span></div>`;
        if (ab.universe !== undefined) abundanceHtml += `<div class="info-item"><span class="label">جهان (%)</span><span class="value">${ab.universe}</span></div>`;
        abundanceHtml += '</div>';
    } else {
        abundanceHtml = '<p style="color:#9aa0b5;">داده فراوانی در دسترس نیست (عنصر مصنوعی/ردیابی)</p>';
    }

    modalBody.innerHTML = `
        <div class="modal-header">
            <div class="modal-symbol-box" style="background: ${getCategoryColor(el.category)}22; border: 2px solid ${getCategoryColor(el.category)};">
                <span class="big-number">${el.number}</span>
                <span class="big-symbol">${el.symbol}</span>
            </div>
            <div class="modal-title">
                <h2>${el.nameFa || el.name} (${el.name})</h2>
                <div class="atomic-mass">جرم اتمی: ${el.mass} u</div>
            </div>
        </div>

        <div class="info-section">
            <h3>اطلاعات پایه</h3>
            <div class="info-grid">
                <div class="info-item"><span class="label">عدد اتمی</span><span class="value">${el.number}</span></div>
                <div class="info-item"><span class="label">جرم اتمی</span><span class="value">${el.mass} u</span></div>
                <div class="info-item"><span class="label">دسته‌بندی</span><span class="value">${translateCategory(el.category)}</span></div>
                <div class="info-item"><span class="label">گروه</span><span class="value">${el.group}</span></div>
                <div class="info-item"><span class="label">دوره</span><span class="value">${el.period}</span></div>
                <div class="info-item"><span class="label">بلوک</span><span class="value">${el.block}</span></div>
                <div class="info-item"><span class="label">حالت استاندارد</span><span class="value">${translatePhase(el.phase)}</span></div>
                <div class="info-item"><span class="label">الکترونگاتیوی</span><span class="value">${el.electronegativity || '—'}</span></div>
            </div>
        </div>

        <div class="info-section">
            <h3>خواص فیزیکی</h3>
            <div class="info-grid">
                <div class="info-item"><span class="label">چگالی (g/cm³)</span><span class="value">${el.density || '—'}</span></div>
                <div class="info-item"><span class="label">نقطه ذوب (K)</span><span class="value">${el.meltingPoint || '—'}</span></div>
                <div class="info-item"><span class="label">نقطه جوش (K)</span><span class="value">${el.boilingPoint || '—'}</span></div>
                <div class="info-item"><span class="label">آرایش الکترونی</span><span class="value">${el.electronConfig || '—'}</span></div>
            </div>
        </div>

        <div class="info-section">
            <h3>فراوانی طبیعی</h3>
            ${abundanceHtml}
        </div>

        <div class="info-section">
            <h3>ایزوتوپ‌ها و فراوانی</h3>
            <table class="isotope-table">
                <thead>
                    <tr>
                        <th>ایزوتوپ</th>
                        <th>عدد جرمی</th>
                        <th>فراوانی</th>
                        <th>نمودار</th>
                    </tr>
                </thead>
                <tbody>${isotopeRows}</tbody>
            </table>
        </div>
    `;

    modal.classList.remove('hidden');
}

function getCategoryColor(cat) {
    const colors = {
        'nonmetal': '#00d4ff', 'noble-gas': '#9b59b6',
        'alkali-metal': '#e74c3c', 'alkaline-earth-metal': '#e67e22',
        'metalloid': '#f1c40f', 'halogen': '#2ecc71',
        'transition-metal': '#3498db', 'post-transition-metal': '#1abc9c',
        'lanthanide': '#ff6b81', 'actinide': '#ff9f43',
        'unknown': '#95a5a6'
    };
    return colors[cat] || '#95a5a6';
}

function translateCategory(cat) {
    const map = {
        'nonmetal': 'نافلز', 'noble-gas': 'گاز نجیب',
        'alkali-metal': 'فلز قلیایی', 'alkaline-earth-metal': 'فلز قلیایی خاکی',
        'metalloid': 'شبه‌فلز', 'halogen': 'هالوژن',
        'transition-metal': 'فلز واسطه', 'post-transition-metal': 'فلز پس‌واسطه',
        'lanthanide': 'لانتانید', 'actinide': 'اکتینید', 'unknown': 'نامشخص'
    };
    return map[cat] || cat;
}

function translatePhase(phase) {
    const map = { 'solid': 'جامد', 'liquid': 'مایع', 'gas': 'گاز' };
    return map[phase] || phase;
}

function closeModal() {
    document.getElementById('modal').classList.add('hidden');
}

document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.trim().toLowerCase();
    const cards = document.querySelectorAll('.element-card');

    cards.forEach(card => {
        const symbol = card.querySelector('.symbol').textContent.toLowerCase();
        const name = card.querySelector('.name').textContent.toLowerCase();
        const number = card.querySelector('.atomic-number').textContent;

        if (query === '' || symbol.includes(query) || name.includes(query) || number.includes(query)) {
            card.style.opacity = '1';
            card.style.pointerEvents = 'auto';
        } else {
            card.style.opacity = '0.15';
            card.style.pointerEvents = 'none';
        }
    });
});

renderPeriodicTable();
</script>
